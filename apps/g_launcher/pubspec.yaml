name: g_launcher
description: G Launcher — your phone, as a Linux desktop.
publish_to: "none"

# versionCode MUST exceed whatever is live on Play right now. Check the console.
# Live is 1; 2 is burned on a rejected release. Hence +6.
version: 6.0.0+21

# Pub workspace member. Without this the root `workspace:` list rejects it and
# melos bootstrap fails with a message about resolution mode.
resolution: workspace

environment:
  # Bumped for pub workspaces, which need 3.6+. If `dart --version` is below
  # that, revert this line and pin the old tooling: melos 6.3.2 with melos.yaml.
  sdk: ^3.6.0

dependencies:
  battery_plus: ^7.1.0

  # Value equality for lists — BootSpec.lines and the LauncherPrefs collections.
  # Was only a transitive dependency; promoted to a DIRECT one because
  # ListEquality is now load-bearing in the engine's ==/hashCode and the boot
  # layer. Relying on it arriving through another package is how it vanishes in
  # a future upgrade and the equality quietly falls back to identity.
  collection: ^1.18.0

  device_info_plus: ^13.2.0
  firebase_analytics: ^12.4.6
  firebase_core: ^4.12.1
  flutter:
    sdk: flutter

  # Play Billing and the owned-SKU set. A workspace path dependency, not a
  # published package: it lives in this repo and G Recovery will depend on the
  # same copy.
  #
  # It resolved WITHOUT this entry, because the pub workspace pulls every member
  # into one resolution — which is exactly why the analyzer flags it. An import
  # that works by accident stops working the day the package leaves the
  # workspace, and that day is the day it becomes genuinely shared.
  g_account:
    path: ../../packages/g_account

  # State. Plain Riverpod 3 — NO codegen, deliberately. If the boilerplate ever
  # starts to hurt, that is the moment to add riverpod_generator. Not before.
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  in_app_update: ^5.0.0

  # The SDK localization delegates that app.dart imports (Material/Widgets/
  # Cupertino built-in strings + RTL text direction for ar). NOT the pub
  # package "flutter_localization" (no s) — that is an unrelated third-party
  # library and its presence here once masked this one being missing.
  flutter_localizations:
    sdk: flutter
  fl_chart: ^1.2.0
  path_provider: ^2.1.6
  # ─── PINNED TO A PRERELEASE, DELIBERATELY, AND HERE IS WHY ────────────────
  #
  # EVERY `*_plus` package pins `win32 ^6`, and this app depends on three of
  # them: device_info_plus and battery_plus are read by terminal_tokens.dart,
  # and a Pigeon getDeviceInfo chain replacing them was built and fully
  # reverted once already, so they are not going anywhere.
  #
  # file_picker 8.3.3 through 11.x pins `win32 ^5`. There is therefore NO
  # version of stable file_picker that resolves against this tree; the first
  # failure blamed share_plus, and removing share_plus only revealed
  # device_info_plus behind it. 12.0.0-beta.1 is where file_picker moved to
  # `win32 ^6`, which pub's own solver told us when it drew its incompatibility
  # range at `<12.0.0-beta.1`.
  #
  # PINNED EXACTLY, no caret. A caret on a prerelease accepts every later beta,
  # and a beta is by definition allowed to change its API between them. Move to
  # `^12.0.0` the day 12 goes stable and delete this comment.
  #
  # The rejected alternatives, so nobody walks these again:
  #
  #   win32 override         resolves, but file_picker 11's Windows
  #                          implementation calls win32 5.x APIs from the same
  #                          Dart package the Android build compiles. Forcing
  #                          it onto 6.x risks a compile error in a plugin's
  #                          Windows code on an Android build, which is a far
  #                          worse thing to debug than this comment.
  #   file_selector          no ANDROID implementation at all.
  #   share_plus for export  removed already and correctly: file_picker saves
  #                          as well as opens, and a backup is filed rather
  #                          than sent. Bringing it back would not have helped
  #                          anyway, since device_info_plus was the real
  #                          blocker.
  file_picker: 12.0.0-beta.7
  firebase_crashlytics: ^5.2.7

  # ─── RESOLVED FROM A VENDORED FORK, NOT FROM PUB ─────────────────────────
  #
  # The version constraint stays, and the SOURCE is redirected by
  # `dependency_overrides` in the WORKSPACE ROOT pubspec, which is the only
  # place pub accepts one. It points at `apps/g_launcher/third_party/dartssh2`.
  #
  # The fork is four lines of behaviour and three of visibility, applied by
  # `tools/fork_dartssh2.py`:
  #
  #   `SSHKeyPair.sign` returns `FutureOr<SSHSignature>` rather than
  #   `SSHSignature`. An Android keystore key signs behind a biometric prompt
  #   and a platform channel, both futures, so a keystore identity could not
  #   satisfy the synchronous interface at all. FutureOr keeps every existing
  #   implementation compiling untouched.
  #
  #   `lib/dartssh2.dart` exports `src/ssh_hostkey.dart`. `SSHKeyPair` is
  #   public and the two types in its own signature were not, which made the
  #   interface impossible to implement from outside the package.
  #
  # BUMPING THE VERSION MEANS RE-VENDORING AND RE-RUNNING THE SCRIPT. It
  # asserts every anchor matched exactly once, so a release that moved the code
  # fails loudly rather than silently reverting the fork. Raising this
  # constraint without doing that resolves to an unforked copy and the keystore
  # identity stops compiling, which is the good failure.
  dartssh2: ^2.22.5
  google_fonts: ^8.2.1
  in_app_purchase: ^3.3.0

flutter_gen:
  assets:
    exclude:
      - assets/themes/**


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # On-device benchmarking, for `integration_test/`. Dev-only, never in the APK.
  #
  # It is here rather than as a one-off because the question it answers recurs:
  # every drawer transition added has to be measured against the cube on the
  # same swipe, and an argument from construction is not a number.
  #
  #   flutter drive \
  #     --driver=test_driver/integration_test.dart \
  #     --target=integration_test/drawer_transition_bench_test.dart \
  #     --profile
  integration_test:
    sdk: flutter

  # Powers tool/i18n_extract.dart (string extraction for translation).
  # Dev-only: analysis machinery has no business in the app's resolution.
  analyzer: ^12.1.0

  # Native bridge codegen (app list, icon engine). Dev-only — not in the APK.
  #   dart run pigeon --input pigeons/launcher_api.dart
  pigeon: ^27.1.2

flutter:
  uses-material-design: true

  assets:
    # Non-recursive: this covers files sitting directly in assets/themes/ and
    # nothing inside its subdirectories. Every theme directory needs its own
    # line below, which is the trap that once left the terminal unbundled.
    - assets/i18n/
    - assets/themes/

    # The folder glyph the drawer, setup and the folders screen all draw.
    # WITHOUT THIS LINE flutter_svg does not throw: it logs and paints nothing,
    # so every folder renders as a name floating over empty space, which reads
    # as a layout bug rather than a packaging one.
    - assets/svg/

    # ─── ONE LINE PER THEME, BECAUSE THE LAYOUT IS FLAT NOW ─────────────
    #
    # Each of these used to be a PAIR, with a second `…/wallpapers/` line under
    # it. The subdirectory is gone: a pack cannot lay out subdirectories on
    # device (`PackPaths` refuses separators), so the bundled tree now mirrors
    # a pack's and `ThemeSource.bundled` joins a bare name straight onto the
    # theme directory. That is what lets one authored theme.json be correct
    # both in the APK and over the CDN.
    #
    # Still non-recursive, so a theme that grows a subdirectory needs its own
    # line here. It should not grow one: anything nested is unreachable from a
    # pack and therefore cannot be named by a theme.json that has to work in
    # both places.
    - assets/themes/ubuntu-24-04/
    - assets/themes/kde-plasma-6/

    # Terminal ships a theme.json only: the TUI shell paints a flat canvas, so
    # a wallpaper would never be visible.
    - assets/themes/terminal/

    # Fedora, Arch and Aqua USED TO BE HERE. They are CDN packs now, because
    # bundled implies free (see theme_registry). Their directories were removed
    # from the repo; leaving these lines behind is what broke the build.

    - assets/brandpacks/simple-icons/
    - assets/heropacks/yaru/

    # The mark that every branded scaffold message carries.
    - assets/brand/

    # Not a font — the licence text, loaded by LicenseRegistry in main.dart.
    # The Ubuntu Font Licence requires it to travel with the fonts.
    - assets/fonts/UBUNTU-FONT-LICENCE-1.0.txt
    - assets/fonts/catalogue.json
    - assets/fonts/licences/
  # Ubuntu + Ubuntu Mono are what make the Ubuntu theme feel real.
  #
  # These family names are load-bearing: they must match theme.json
  # ("display": "Ubuntu", "mono": "UbuntuMono") EXACTLY. A mismatch does not
  # error — it silently renders Roboto.
  #
  # Run scripts/fetch_fonts.sh to populate assets/fonts/.
  fonts:
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu-Regular.ttf
        - asset: assets/fonts/Ubuntu-Italic.ttf
          style: italic
        - asset: assets/fonts/Ubuntu-Medium.ttf
          weight: 500
        - asset: assets/fonts/Ubuntu-Bold.ttf
          weight: 700

    - family: UbuntuMono
      fonts:
        - asset: assets/fonts/UbuntuMono-Regular.ttf
        - asset: assets/fonts/UbuntuMono-Bold.ttf
          weight: 700