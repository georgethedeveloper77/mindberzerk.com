name: g_recovery
description: "Recover deleted files, audit your storage, and back up to your own server."
publish_to: 'none'
version: 2.0.0+10

environment:
  sdk: ^3.12.1

dependencies:
  device_probe:
    path: ../../packages/device_probe
  firebase_analytics: ^12.4.6
  fl_chart: ^1.2.0

  flutter:
    sdk: flutter

  # Arabic and Urdu, and nothing else needs it.
  #
  # Without this, MaterialApp supports exactly one locale, English, so setting
  # Locale('ar') resolves straight back to English and Directionality never
  # flips. The app would show Arabic words in a left to right layout with the
  # back arrow on the wrong edge, which reads as broken rather than untranslated.
  #
  # It also supplies the Material and Cupertino strings for everything this app
  # does not own: the text selection menu, the date picker, the scrollbar
  # semantics. Those are not in assets/content and never will be.
  flutter_localizations:
    sdk: flutter

  # State. Plain Riverpod, no codegen, matching G Launcher. Pin this to the
  # SAME constraint the launcher uses: once both apps join the pub workspace
  # they share one resolution, and a mismatch here is resolved silently in
  # favour of whichever is stricter rather than reported.
  flutter_riverpod: ^3.3.2

  # Rendering only. The `pdf` package writes PDFs and cannot display one, which
  # is why it was removed: nothing imported it.
  pdfx: ^2.9.2

  # Theme mode, accent, selected tab, and every future setting. JSON blobs
  # under named keys, not Drift: nothing in this app is relational.
  shared_preferences: ^2.5.5

  # The splash animation only. One file, 8 KB, pure vector, so its colours can
  # be replaced at runtime to follow the accent.
  lottie: ^3.5.1

  video_player: ^2.13.0
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Build time only, both of them. flutter_launcher_icons generates icons once
  # and pigeon generates bridges once; neither ships in the APK, and having them
  # under dependencies was pulling them into the release graph for nothing.
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  pigeon: ^27.1.2

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/g_recovery.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/g_recovery.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icons/g_recovery.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/g_recovery.png"

flutter:
  uses-material-design: true
  assets:
    - assets/packs/
    - assets/content/
    - assets/lottie/

    # The picker, one image per language rather than an emoji.
    #
    # The emoji flag glyphs live in the system emoji font, and on the budget
    # devices this app is built for that font often has none, so a row renders
    # as two boxed letters. These are 72 by 48 lossless WebP, which is 3x for
    # the 24 by 16 the row draws, and 19 KB for all 25.
    #
    # The file name is a LANGUAGE code. Which country stands in for a language
    # is recorded in assets/flags/ATTRIBUTION.md and changing one is a matter of
    # overwriting a single file.
    - assets/flags/