name: g_family
description: Links the Mindberzerk apps. G Launcher and G Recovery read G VPN's status and connect, disconnect or pause it.
publish_to: "none"
version: 0.1.0

# Workspace member, used by G Launcher and G Recovery. G VPN itself does not
# depend on it: G VPN is the side that answers.
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.mindberzerk.g_family
        pluginClass: GFamilyPlugin
