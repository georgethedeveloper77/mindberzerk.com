# Firebase App Hosting configuration for mindberzerk.com.
#
# ONE BACKEND SERVES TWO AUDIENCES NOW: `/` is the public site, everything else
# is the console behind the UID allowlist. That makes the notes below MORE
# important, not less: the signing key lives on an origin a stranger can reach
# the front page of.
#
# THE MOST IMPORTANT LINES IN THIS REPO ARE THE `secret:` ONES BELOW.
#
# PACK_SIGNING_KEY is the ed25519 private half whose public counterpart is baked
# into every shipped APK as PackKeys.ACCEPTED_HEX. If it ever reaches a browser,
# every pack signature in the ecosystem is worthless and the fix is a Play
# release plus a key rotation on every device. It is referenced here as a Secret
# Manager secret, never as a value, and it is read ONLY from server code.
#
# Note there is no NEXT_PUBLIC_ prefix on any of these. That prefix is what
# inlines a value into the client bundle, and it is the single mistake that
# would make this whole scheme decorative.

runConfig:
  # A publish signs and uploads several MB. One instance is plenty for a panel
  # with one user, and it keeps the cost at roughly nothing when idle.
  minInstances: 0
  maxInstances: 2
  concurrency: 20
  cpu: 1
  memoryMiB: 512

env:
  # ── server-only secrets ──────────────────────────────────────────────────
  - variable: PACK_SIGNING_KEY
    secret: pack-signing-key
    availability:
      - RUNTIME

  - variable: R2_ACCESS_KEY_ID
    secret: r2-access-key-id
    availability:
      - RUNTIME

  - variable: R2_SECRET_ACCESS_KEY
    secret: r2-secret-access-key
    availability:
      - RUNTIME

  # Comma-separated Firebase Auth UIDs allowed to sign in.
  #
  # AN ALLOWLIST, NOT A ROLE CHECK, and a secret rather than a config value.
  # This panel can write to the CDN that every installed launcher trusts, so
  # "who may sign in" is not a setting, it is a credential.
  - variable: ADMIN_UIDS
    secret: admin-uids
    availability:
      - RUNTIME

  # ── non-secret config ────────────────────────────────────────────────────
  - variable: R2_ENDPOINT
    value: https://2df6df2e2ed97a0affaa1d17e48ebb3a.r2.cloudflarestorage.com
    availability:
      - RUNTIME

  - variable: R2_BUCKET
    value: mindberzerk-cdn
    availability:
      - RUNTIME

  # The key id written into every manifest and index this panel signs. Must be
  # a key present in PackKeys.ACCEPTED_HEX in the shipped app, or every pack is
  # refused with UnknownKey.
  - variable: PACK_KEY_ID
    value: mh-2026-07
    availability:
      - RUNTIME

  # Client-side Firebase config. Public by design: these identify the project,
  # they do not authorise anything. Auth is enforced server-side against the
  # allowlist above.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBoeQ6d_RSXqfAMSye7KKS56NrnvZpH-vE
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: mindberzerk-3eaf5.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: mindberzerk-3eaf5
    availability:
      - BUILD
      - RUNTIME

  - variable: GCP_PROJECT
    value: mindberzerk-3eaf5
    availability:
      - RUNTIME

  # ── the public site ──────────────────────────────────────────────────────
  # Where the landing reads site/content.json and the live index from. The
  # PUBLIC CDN, with no credential: the landing must render when the R2 S3
  # token is rejected, which is the state it is in today.
  - variable: CDN_BASE_URL
    value: https://cdn.mindberzerk.com
    availability:
      - RUNTIME

  # Shown on the landing and used for the mailto fallback before SMTP exists.
  # Public by design, hence the prefix.
  - variable: NEXT_PUBLIC_CONTACT_EMAIL
    value: info@mindberzerk.com
    availability:
      - BUILD
      - RUNTIME

  # Contact form delivery over the studio's own Plesk SMTP. Cloud Run permits
  # outbound 465 and 587; only port 25 is blocked. Until all five exist the
  # route answers 503 and the form degrades to a mailto link, so the section
  # works before the secrets do.
  - variable: SITE_SMTP_HOST
    secret: site-smtp-host
    availability:
      - RUNTIME

  - variable: SITE_SMTP_PORT
    secret: site-smtp-port
    availability:
      - RUNTIME

  - variable: SITE_SMTP_USER
    secret: site-smtp-user
    availability:
      - RUNTIME

  - variable: SITE_SMTP_PASS
    secret: site-smtp-pass
    availability:
      - RUNTIME

  - variable: SITE_CONTACT_TO
    secret: site-contact-to
    availability:
      - RUNTIME

  # ── analytics ────────────────────────────────────────────────────────────
  # TWO DIFFERENT NUMBERS, and confusing them is the whole trap.
  #
  # The measurement id is what the SITE SENDS WITH. Public, inlined into the
  # browser bundle by the NEXT_PUBLIC_ prefix, which is correct: it identifies
  # a data stream and authorises nothing.
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-8RHHEN2X07
    availability:
      - BUILD
      - RUNTIME

  # The property id is what the DASHBOARD READS WITH, via the GA4 Data API. A
  # different, numeric id, found in GA4 admin under Property details. Putting
  # the G- id here produces a permission error rather than a clear one, so the
  # reader checks for that specific mistake by name.
  #
  # Also add the App Hosting service account as a Viewer in GA4 admin, Property
  # access management, or every read returns PERMISSION_DENIED.
  # - variable: GA4_PROPERTY_ID
  #   value: "000000000"
  #   availability:
  #     - RUNTIME
